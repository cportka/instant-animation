<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Instant Animation</title>
    <meta
      name="description"
      content="Describe anything; watch it animate. A gallery of hand-generated canvas animations."
    />
    <meta name="theme-color" content="#02010a" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="Animation"></canvas>

    <!-- The only things on screen besides the animation, and only when there is somewhere to go. -->
    <button class="nav nav--up" id="nav-up" type="button" aria-label="Previous animation" hidden>
      <svg viewBox="0 0 44 24" aria-hidden="true" focusable="false">
        <path d="M4 18 L22 6 L40 18" />
      </svg>
    </button>

    <button class="nav nav--down" id="nav-down" type="button" aria-label="Next animation" hidden>
      <svg viewBox="0 0 44 24" aria-hidden="true" focusable="false">
        <path d="M4 6 L22 18 L40 6" />
      </svg>
    </button>

    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <noscript>
      <p class="notice">
        These animations are drawn in real time with JavaScript and canvas.<br />
        Enable JavaScript to watch them.
      </p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
