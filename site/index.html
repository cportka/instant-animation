    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Instant Animation</title>
    <meta
      name="description"
      content="Describe anything; watch it animate. A gallery of hand-generated canvas animations."
    />
    <meta name="theme-color" content="#02010a" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />

    <canvas id="stage" role="img" aria-label="Animation"></canvas>

    <!--
      The knob panel. Empty here on purpose: the rack is stocked from the mounted scene's
      `meta.knobs`, because which knobs exist is a fact about the artwork. Only the shell of it — the
      frame and the reset — is markup, so the site tests can read it off the file.

      No text anywhere in it, including on the reset. A knob's colour is its label; the reset is a
      black square. The accessible names are attributes, which is where a name belongs on a page
      whose entire premise is that there is nothing written on it.
    -->
    <div class="panel" id="panel" hidden>
      <div class="panel__rack" id="knobs"></div>
      <button class="panel__reset" id="knobs-reset" type="button" aria-label="Reset the knobs"></button>
    </div>

    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <noscript>

        These animations are drawn in real time with JavaScript and canvas.<br />
        Enable JavaScript to watch them.
      </p>
