<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Instant Animation</title>
    <meta
      name="description"
      content="Describe anything; watch it animate. A gallery of hand-generated canvas animations."
    />
    <meta name="theme-color" content="#02010a" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <canvas id="stage" role="img" aria-label="Animation"></canvas>

    <!--
      The only things on screen besides the animation, and only when there is somewhere to go.

      Each button carries every glyph the gallery knows how to draw, and `data-chrome` — set from
      the mounted scene's `meta.chrome` — decides which one is shown. Markup rather than innerHTML
      so the shapes stay declarative and the site tests can read them straight off the file.
    -->
    <button class="nav nav--up" id="nav-up" type="button" aria-label="Previous animation" hidden>
      <svg class="nav__glyph nav__glyph--neon" viewBox="0 0 44 24" aria-hidden="true" focusable="false">
        <path d="M4 18 L22 6 L40 18" />
      </svg>
      <svg class="nav__glyph nav__glyph--pixel" viewBox="0 0 44 24" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
        <rect x="20" y="2" width="4" height="4" />
        <rect x="16" y="6" width="12" height="4" />
        <rect x="12" y="10" width="20" height="4" />
        <rect x="8" y="14" width="28" height="4" />
        <rect x="4" y="18" width="36" height="4" />
      </svg>
      <svg class="nav__glyph nav__glyph--vapour" viewBox="0 0 44 24" aria-hidden="true" focusable="false">
        <path class="nav__vapour-haze" d="M4 18 L22 6 L40 18" />
        <path class="nav__vapour-core" d="M4 18 L22 6 L40 18" />
      </svg>
    </button>

    <button class="nav nav--down" id="nav-down" type="button" aria-label="Next animation" hidden>
      <svg class="nav__glyph nav__glyph--neon" viewBox="0 0 44 24" aria-hidden="true" focusable="false">
        <path d="M4 6 L22 18 L40 6" />
      </svg>
      <svg class="nav__glyph nav__glyph--pixel" viewBox="0 0 44 24" aria-hidden="true" focusable="false" shape-rendering="crispEdges">
        <rect x="4" y="2" width="36" height="4" />
        <rect x="8" y="6" width="28" height="4" />
        <rect x="12" y="10" width="20" height="4" />
        <rect x="16" y="14" width="12" height="4" />
        <rect x="20" y="18" width="4" height="4" />
      </svg>
      <svg class="nav__glyph nav__glyph--vapour" viewBox="0 0 44 24" aria-hidden="true" focusable="false">
        <path class="nav__vapour-haze" d="M4 6 L22 18 L40 6" />
        <path class="nav__vapour-core" d="M4 6 L22 18 L40 6" />
      </svg>
    </button>

    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <noscript>
      <p class="notice">
        These animations are drawn in real time with JavaScript and canvas.<br />
        Enable JavaScript to watch them.
      </p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
